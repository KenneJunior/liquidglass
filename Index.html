<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liquid Glass v4 — Usage</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            gap: 48px;
            align-items: center;
            justify-content: center;
            background: #07090f url('https://kjunior.vercel.app/pics/[J]__27.jpg') center/cover fixed;
        }

        .my-glass-card {
            position: relative;
            width: 200px;
            height: 320px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 26px;
            color: white;
            font-family: sans-serif;
            padding: 24px;
            cursor: pointer;
            overflow: hidden;

            --lg-refractive-index: 1.6;
            --lg-glass-thickness: 120;
            --lg-bezel-width: 28;
            --lg-refraction-scale: 1.2;
            --lg-max-tilt: 10;
        }

        .my-glass-card:hover {
            --lg-refraction-scale: 2.0;
            --lg-max-tilt: 18;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .custom-blob[data-lg-mask] {
            border: none;
            /* FIX: 1% opacity required for Chrome to render the masked backdrop blur */
            background: rgba(255, 255, 255, 0.01);
            border-radius: 0;
        }
    </style>
</head>
<body>

<div class="my-glass-card">
    <h2>Standard Rect</h2>
    <p style="color:black;">Hover me to see the CSS variables dynamically change the refraction scale and tilt limit.</p>
</div>

<div class="my-glass-card custom-blob"
     data-lg-mask="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0nMzIwJyBoZWlnaHQ9JzI0MCcgdmlld0JveD0nMCAwIDMyMCAyNDAnIHhtbG5zPSdodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2Zyc+PHBhdGggZD0nTTQwLDQwIFExNjAsLTIwIDI4MCw0MCBUMjgwLDIwMCBRMTYwLDI2MCA0MCwyMDAgVDQwLDQwIFonIGZpbGw9J2JsYWNrJy8+PC9zdmc+">
    <h2>Custom Blob</h2>
    <p>My edges are calculated purely from the SVG mask's alpha channel.</p>
</div>

<script type="module">
    import { LiquidGlass } from './src';

    LiquidGlass.init('.my-glass-card', {
        enableOrb: true,
        orbColor: 'rgba(255,255,255,0.15)'
    });

    document.querySelectorAll('.my-glass-card').forEach(card => {
        card.addEventListener('click', (e) => {
            LiquidGlass.addRipple(card, e);
        });
    });
</script>

</body>
</html>
