<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liquid Glass v4 — Usage</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            gap: 48px;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            background: #07090f url('src/wallpaper.jpg') center/cover fixed;
        }

        .my-glass-card {
            position: relative;
            width: 500px;
            max-width: 90vw;
            height: 100px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 99999px;
            color: white;
            font-family: sans-serif;
            padding: 24px;
            cursor: pointer;
            overflow: hidden;

            --lg-refractive-index: 1.9;
            --lg-glass-thickness: 120;
            --lg-bezel-width: 28;
            --lg-refraction-scale: 1.2;
            --lg-max-tilt: 10;
            --lg-blur: 5;
            --lg-saturation: 2.0;
            --lg-brightness: 0.8;

            /* forwards ensures it stays visible at 100% */
            animation: glass-reveal 5s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            /* 3. Smooth, slow transitions for CSS properties ONLY (No 'all') */
            transition: border-color 0.8s cubic-bezier(0.25, 1, 0.3, 1),
            background 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }

        .my-glass-card:nth-child(2) {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .my-glass-card:hover {
            --lg-refraction-scale: 1.4;
            --lg-max-tilt: 18;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }
        .custom-blob[data-lg-mask] {
            display: none;
            border: none;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 0;
        }

        @keyframes glass-reveal {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }


    </style>
</head>
<body>

<div class="my-glass-card">
    <h2>Standard Rect</h2>
    <p>Hover me to see the CSS variables dynamically change the refraction scale and tilt limit.</p>
</div>

<div class="my-glass-card custom-blob"
     data-lg-mask="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0nMzIwJyBoZWlnaHQ9JzI0MCcgdmlld0JveD0nMCAwIDMyMCAyNDAnIHhtbG5zPSdodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2Zyc+PHBhdGggZD0nTTQwLDQwIFExNjAsLTIwIDI4MCw0MCBUMjgwLDIwMCBRMTYwLDI2MCA0MCwyMDAgVDQwLDQwIFonIGZpbGw9J2JsYWNrJy8+PC9zdmc+">
    <h2>Custom Blob</h2>
    <p>My edges are calculated purely from the SVG mask's alpha channel.</p>
</div>

<script type="module">
    import { LiquidGlass } from './src';

    LiquidGlass.init('.my-glass-card', {
        enableOrb: true,
        orbColor: 'rgba(255,255,255,0.15)'
    });

    document.querySelectorAll('.my-glass-card').forEach(card => {
        card.addEventListener('click', (e) => {
            LiquidGlass.addRipple(card, e, {
                color:'rgb(255,255,255)',
                sizeMultiplier:4,
                durationMs: 4000,
            });
        });
    });
</script>

</body>
</html>
