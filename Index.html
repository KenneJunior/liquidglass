<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liquid Glass v4 — Usage</title>
    <style>
        :root {
            --lg-refractive-index: 1.9;
            --lg-glass-thickness: 120;
            --lg-bezel-width: 28;
            --lg-refraction-scale: 1.6;
            --lg-max-tilt: 15;
            --lg-blur: 1;
            --lg-saturation: 2.0;
            --lg-brightness: 0.5;
            --lg-aberattion: 0.2;
            --lg-magnetic-pull:0;
        }
        body {
            min-height: 100vh;
            display: flex;
            gap: 48px;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            background: #07090f url('../liquidglass/src/wallpaper.jpg') center/cover fixed;
        }

        .my-glass-card {
            position: relative;
            width: 500px;
            height: 100px;
            max-width: 90vw;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 99999px;
            color: white;
            font-family: sans-serif;
            padding: 24px;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            will-change: transform;
            overflow: hidden;


        }
        .my-glass-card-1 {
            position: relative;
            width: 500px;
            height: 100px;
            max-width: 90vw;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 99999px;
            color: white;
            font-family: sans-serif;
            padding: 24px;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            will-change: transform;
            overflow: hidden;
        }

        .my-glass-card:nth-child(2) {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .liquid-glass-inner {
            pointer-events: none;
        }

        .custom-blob[data-lg-mask] {
            display: none;
            border: none;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 0;
        }

        @keyframes glass-reveal {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<button class="my-glass-card">
    Standard Rect
</button>
<button class="my-glass-card-1">
    Standard Rect
</button>

<div class="my-glass-card custom-blob"
     data-lg-mask="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0nMzIwJyBoZWlnaHQ9JzI0MCcgdmlld0JveD0nMCAwIDMyMCAyNDAnIHhtbG5zPSdodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2Zyc+PHBhdGggZD0nTTQwLDQwIFExNjAsLTIwIDI4MCw0MCBUMjgwLDIwMCBRMTYwLDI2MCA0MCwyMDAgVDQwLDQwIFonIGZpbGw9J2JsYWNrJy8+PC9zdmc+">
    <h2>Custom Blob</h2>
    <p>My edges are calculated purely from the SVG mask's alpha channel.</p>
</div>

<script type="module">
    import { LiquidGlass } from './src/index.js';

    LiquidGlass.init('.my-glass-card', {
        enableOrb: false,
    });
    LiquidGlass.init('.my-glass-card-1', {
        enableOrb: false,
    });

    document.querySelectorAll('.my-glass-card').forEach(card => {
        card.addEventListener('click', (e) => {
            LiquidGlass.addRipple(card, e, {
                color:'rgb(255,255,255)',
                sizeMultiplier:4,
                durationMs: 4000,
            });
        });
    });
</script>

</body>
</html>
